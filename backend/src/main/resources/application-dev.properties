# H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:jobportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (access at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT config
jwt.secret=ReplaceThisWithAStrongRandomSecretKeyOfYourChoiceWithAtLeast32Chars
jwt.expiration-ms=86400000

# AI parser endpoint
ai.resume.parser.url=http://localhost:5001
parser.url=http://localhost:5001/parse

# File storage (local)
file.storage.location=uploads

# Max file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
