# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional but good to be explicit
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# JWT config
jwt.secret=ReplaceThisWithAStrongRandomSecretKeyOfYourChoiceWithAtLeast32Chars
jwt.expiration-ms=86400000
ai.resume.parser.url=http://localhost:5001

# File storage (local)
file.storage.location=uploads

# AI parser endpoint
parser.url=http://localhost:5001/parse

# CORS (if needed)
# allowed.origins=http://localhost:4200
